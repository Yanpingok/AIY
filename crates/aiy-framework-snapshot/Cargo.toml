[package]
name = "aiy-framework-snapshot"
version.workspace = true
edition = "2021"
authors = ["Mysten Labs <eng@mystenlabs.com>"]
description = "Tool to create a bytecode snapshot of the current aiy-framework"
license = "Apache-2.0"
publish = false

[dependencies]
